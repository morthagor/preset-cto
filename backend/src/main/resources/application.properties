# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Data JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/presetcto_db
spring.datasource.username=presetcto
spring.datasource.password=presetcto123
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
app.jwtSecret=mySecretKeyForPresetCTOApplicationDevelopment123456789WithEnoughLength
app.jwtExpirationMs=86400000

# Logging
logging.level.root=INFO
logging.level.com.presetcto=DEBUG
logging.level.org.springframework.security=DEBUG

# Application Info
spring.application.name=Preset CTO API
